[system]
execution_mode = "paper"
database_path = "data/flight_recorder.db"
starting_equity_usd = 40.0
stale_after_seconds = 120

[safety.cex]
minimum_age_minutes = 10080
minimum_liquidity_usd = 1000000.0
maximum_entry_price_impact_pct = 1.0
maximum_exit_price_impact_pct = 1.5
maximum_top10_private_holder_pct = 25.0

[safety.solana_emerging]
minimum_age_minutes = 60
# The absolute backstop only. Whether an order is too large for this pool is a
# position-size question, enforced by [risk.micro].maximum_pool_share_pct, and
# duplicating it here as a fixed floor would silently encode an account size.
minimum_liquidity_usd = 5000.0
maximum_entry_price_impact_pct = 2.0
maximum_exit_price_impact_pct = 3.0
maximum_top10_private_holder_pct = 30.0

[safety.clusters]
# Vendor-label tier: a fast pre-filter over a discovery feed's precomputed
# concentration metrics. Treated as unverified third-party evidence.
maximum_insider_pct = 15.0
maximum_sniper_pct = 15.0
maximum_bundler_pct = 5.0
maximum_fresh_wallet_pct = 20.0
# Developer distribution as a band, not a flag. Below the lower bound is dust
# (a candidate was once rejected on 1.47e-08 percent of supply); at or above the
# upper bound the developer has fully exited and holds no supply left to sell,
# which measured as the *safest* state across 871 mints -- 7% death versus 28%
# for tokens whose developer had sold nothing. What rejects is the middle:
# still holding, and selling into the buyers it attracted.
maximum_dev_sell_pct = 1.0
exhausted_dev_sell_pct = 50.0
maximum_dev_prior_launches = 2
minimum_vendor_confidence = 0.6

# Independent funding-graph tier reconstructed from on-chain data.
maximum_linked_cluster_pct = 10.0
maximum_single_funder_fresh_wallet_pct = 30.0
minimum_holder_coverage_pct = 80.0
minimum_graph_confidence = 0.5
reject_on_launch_bundle = true
require_bundle_evidence = false

[risk]
risk_per_cex_trade_pct = 0.5
capital_at_risk_per_solana_trade_pct = 0.25
maximum_daily_loss_pct = 1.0
maximum_open_positions = 2
maximum_aggregate_open_risk_pct = 1.0
consecutive_loss_limit = 3

[risk.micro]
# Below equity_threshold_usd, percentage-of-equity sizing produces positions too
# small to execute (0.25% of $40 is $0.10). Sizing switches to catastrophic-loss
# logic: the position is the risk, because a thin meme coin can reach zero or
# stop being sellable before any stop can fill.
equity_threshold_usd = 100.0
max_position_usd = 10.0
# Sized from measured GEOMETRIC GROWTH, not arithmetic expectancy. Expectancy
# chose the previous 10%, and 10% is catastrophically over-Kelly on a
# distribution whose median outcome is 0.001: expected log growth there is
# -0.0274 per trade, which decays the account to 25% of starting equity over 50
# trades even counting the tail. Measured across the deep-pool distribution
# (n=166), growth turns positive only below about 3%:
#
#   f=2%  +0.0029/trade   f=3%  +0.0012   f=5%  -0.0048   f=10%  -0.0274
#
# 2% of $40 is $0.80, which clears the measured cost floor of $0.37 (the
# smallest position whose round trip stays within 10% of the position). It also
# buys ~25 concurrent shots at the aggregate cap instead of ~5, which is the
# regime a 4-6% tail actually needs.
#
# The earlier justification -- "at 10% the account survives long enough for an
# edge to show" -- was reasoning about ruin from the observed total-loss rate
# (2 of 9) rather than computing growth. It was wrong by roughly 5x.
position_pct_of_equity = 2.0
# Derived, not chosen. costs.minimum_viable_position_usd puts the floor at $0.37
# for a round trip within 10% of the position; $0.50 keeps a margin above it.
# The previous 3.00 was a preference and it forbade the growth-optimal size.
minimum_viable_position_usd = 0.50
maximum_round_trip_cost_pct = 8.0
# Liquidity is gated as a share of the pool the order actually routes through,
# with an absolute backstop. An absolute floor alone encodes an account size.
maximum_pool_share_pct = 0.5
minimum_pool_liquidity_usd = 5000.0
maximum_aggregate_open_position_pct = 50.0

# --------------------------------------------------------------------------
# The memecoin scout: the operator's execution mandate, as computed thresholds.
#
# Every value here comes from one of two places, and the comment says which:
# the operator's mandate, or a measurement in STATUS.md. A number without a
# justification is a future defect.
#
# `scout` refuses to run when any value in [scout.filters] is missing. The
# mandate's "you are not permitted to assume missing values" is implemented
# rather than instructed, so a forgotten parameter stops the run instead of
# silently taking a default.
# --------------------------------------------------------------------------

[scout.filters]
# Mandate: "Maximum 48 hours (2 days) old from initial deployment."
#
# MEASURED NON-BINDING on the population this project observes. Over 18,942
# mints the rejected cohort's p90 age is 7.2 minutes, so a 48-hour cap admits
# 100% of what the feeds return and filters nothing. Age also fails to separate
# outcomes in either direction: the 10x winners are *younger* at observation
# (p50 2.61 min) than the deaths (p50 4.06 min).
#
# Kept because the operator asked that no parameter be deleted, and because the
# intent is coherent -- it is an upper bound holding entries inside the
# high-volume launch window, and it would bind if the feed ever widened past
# launchpad tokens. Journalled with every decision so its non-bindingness stays
# visible rather than being rediscovered.
maximum_token_age_hours = 48.0

# Mandate, added in a later revision: "any token without volume means no one is
# buying". New as an absolute floor -- volume previously entered only as a
# *ratio* inside detect_breakout, which says nothing about absolute activity.
minimum_volume_usd = 5000.0

# Absolute backstop only. Whether an order is too large for this pool is a
# position-size question enforced by [risk.micro].maximum_pool_share_pct.
minimum_liquidity_usd = 5000.0

# Mandate: "Minimum and maximum market cap range."
#
# Journalled ALONGSIDE pool depth, never instead of it. Market capitalisation is
# not exit liquidity: the video workflow this mandate came from filtered on
# mcap > $50k, and the ~$50k *liquidity* filter was withdrawn at n=166 when
# deleting a single 209.7x token flipped growth negative at every position size.
# Size against pool depth and quoted impact; mcap is context.
minimum_market_cap_usd = 20000.0
maximum_market_cap_usd = 5000000.0

# Mandate: "Maximum acceptable spread" and "Slippage tolerance". Both are
# checked against a real Jupiter route quote, never estimated from pool depth
# via constant-product maths -- that was deliberately not built, because it
# would substitute an estimate for a quote inside a gate whose purpose is
# verifying a real executable route.
maximum_spread_pct = 2.0
slippage_tolerance_pct = 2.0

# Mandate: "Maximum daily loss cap". At $50 equity and $10 positions this is
# two full losses if stops hold, or one if a stop gaps.
maximum_daily_loss_usd = 10.0

# Mandate: "Preferred trade duration (ultra-scalp / intraday / rotation)".
trade_duration = "intraday"

# Mandate: "Pre-bond / bonded / both".
universe = "both"

# Mandate: no re-entry. "This way he can't enter a farm token that keeps
# pumping, dumping and pumping again to attract ppl." A structural mechanism
# rather than a single case, which is the bar for encoding a rule -- but it is a
# RISK filter, so scripts/study_reentry_value.py judges it on death rate before
# it may inform anything beyond rejection.
forbid_reentry = true

# Mandate: the first-minute scam-pump filter. "its first 1m candle all the way
# to $1.8m mcap which was an obvious scam pump token". Reject when the first
# traded minute spans more than this multiple of its own open -- a token that
# goes vertical on minute one has no organic accumulation behind it.
#
# Computed from trades_only candles, so a carried-forward zero-volume bar can
# neither fake nor mask it. Missing first-candle data yields UNKNOWN, which
# cannot pass. Judged on death rate by scripts/study_first_candle_pump.py.
maximum_first_candle_multiple = 3.0

# --------------------------------------------------------------------------
# Strictness levels. The operator switches between them; the scout refuses to
# run without one. These tuples are the single visible act that turns research
# into trading: MonitorConfig.readiness_policy admits no lifecycle state by
# default, and widening it needs a study. So a level reaches entry only when its
# study passes; until then it scans and journals.
# --------------------------------------------------------------------------

[strictness.level_1]
# Mandate Level 1, CONSERVATIVE: "Minimum 4 confluence signals", volume
# expansion >= 3x, "Maximum 2 trades per session", "Stop after 1 consecutive
# loss".
#
# COLLISION, recorded rather than resolved: capturing a tail of p~5.8% needs
# about 3/p ~ 50 attempts, and a 2-trade cap makes reaching it structurally
# impossible. Level 1 is therefore a capital-preservation mode, not an
# edge-capture mode. That is a coherent thing to want; it is not a way to make
# money on a fat-tailed distribution.
minimum_confluence_signals = 4
minimum_volume_expansion = 3.0
maximum_trades_per_session = 2
consecutive_loss_stop = 1
risk_pct_of_equity = 1.0
readiness_policy = []

[strictness.level_2]
# Mandate Level 2, BALANCED: 3 signals, >= 2x volume expansion, 3 trades,
# stop after 2 consecutive losses.
minimum_confluence_signals = 3
minimum_volume_expansion = 2.0
maximum_trades_per_session = 3
consecutive_loss_stop = 2
risk_pct_of_equity = 1.6
readiness_policy = []

[strictness.level_3]
# Mandate Level 3, AGGRESSIVE: 2 momentum confirmations, clear volume spike,
# up to 5 trades, stop after 3 consecutive losses.
#
# 5 trades at $10 is the whole $50 book, so this level is fully invested after
# five entries and cannot open a sixth. That is the shot-count ceiling the
# sizing decision bought.
minimum_confluence_signals = 2
minimum_volume_expansion = 1.5
maximum_trades_per_session = 5
consecutive_loss_stop = 3
risk_pct_of_equity = 2.0
readiness_policy = []

# Every readiness_policy above is deliberately EMPTY. An empty tuple admits no
# lifecycle state, so no level can open a position until its study passes and
# the tuple is widened on evidence. This is the fail-closed default that keeps
# an unproven level out of the entry path, and it is the one line to change when
# a study returns PROVEN.
