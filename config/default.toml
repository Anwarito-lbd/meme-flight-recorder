[system]
execution_mode = "paper"
database_path = "data/flight_recorder.db"
starting_equity_usd = 40.0
stale_after_seconds = 120

[safety.cex]
minimum_age_minutes = 10080
minimum_liquidity_usd = 1000000.0
maximum_entry_price_impact_pct = 1.0
maximum_exit_price_impact_pct = 1.5
maximum_top10_private_holder_pct = 25.0

[safety.solana_emerging]
minimum_age_minutes = 60
# The absolute backstop only. Whether an order is too large for this pool is a
# position-size question, enforced by [risk.micro].maximum_pool_share_pct, and
# duplicating it here as a fixed floor would silently encode an account size.
minimum_liquidity_usd = 5000.0
maximum_entry_price_impact_pct = 2.0
maximum_exit_price_impact_pct = 3.0
maximum_top10_private_holder_pct = 30.0

[safety.clusters]
# Vendor-label tier: a fast pre-filter over a discovery feed's precomputed
# concentration metrics. Treated as unverified third-party evidence.
maximum_insider_pct = 15.0
maximum_sniper_pct = 15.0
maximum_bundler_pct = 5.0
maximum_fresh_wallet_pct = 20.0
# Developer distribution as a band, not a flag. Below the lower bound is dust
# (a candidate was once rejected on 1.47e-08 percent of supply); at or above the
# upper bound the developer has fully exited and holds no supply left to sell,
# which measured as the *safest* state across 871 mints -- 7% death versus 28%
# for tokens whose developer had sold nothing. What rejects is the middle:
# still holding, and selling into the buyers it attracted.
maximum_dev_sell_pct = 1.0
exhausted_dev_sell_pct = 50.0
maximum_dev_prior_launches = 2
minimum_vendor_confidence = 0.6

# Independent funding-graph tier reconstructed from on-chain data.
maximum_linked_cluster_pct = 10.0
maximum_single_funder_fresh_wallet_pct = 30.0
minimum_holder_coverage_pct = 80.0
minimum_graph_confidence = 0.5
reject_on_launch_bundle = true
require_bundle_evidence = false

[risk]
risk_per_cex_trade_pct = 0.5
capital_at_risk_per_solana_trade_pct = 0.25
maximum_daily_loss_pct = 1.0
maximum_open_positions = 2
maximum_aggregate_open_risk_pct = 1.0
consecutive_loss_limit = 3

[risk.micro]
# Below equity_threshold_usd, percentage-of-equity sizing produces positions too
# small to execute (0.25% of $40 is $0.10). Sizing switches to catastrophic-loss
# logic: the position is the risk, because a thin meme coin can reach zero or
# stop being sellable before any stop can fill.
equity_threshold_usd = 100.0
max_position_usd = 10.0
# Sized from measured GEOMETRIC GROWTH, not arithmetic expectancy. Expectancy
# chose the previous 10%, and 10% is catastrophically over-Kelly on a
# distribution whose median outcome is 0.001: expected log growth there is
# -0.0274 per trade, which decays the account to 25% of starting equity over 50
# trades even counting the tail. Measured across the deep-pool distribution
# (n=166), growth turns positive only below about 3%:
#
#   f=2%  +0.0029/trade   f=3%  +0.0012   f=5%  -0.0048   f=10%  -0.0274
#
# 2% of $40 is $0.80, which clears the measured cost floor of $0.37 (the
# smallest position whose round trip stays within 10% of the position). It also
# buys ~25 concurrent shots at the aggregate cap instead of ~5, which is the
# regime a 4-6% tail actually needs.
#
# The earlier justification -- "at 10% the account survives long enough for an
# edge to show" -- was reasoning about ruin from the observed total-loss rate
# (2 of 9) rather than computing growth. It was wrong by roughly 5x.
position_pct_of_equity = 2.0
# Derived, not chosen. costs.minimum_viable_position_usd puts the floor at $0.37
# for a round trip within 10% of the position; $0.50 keeps a margin above it.
# The previous 3.00 was a preference and it forbade the growth-optimal size.
minimum_viable_position_usd = 0.50
maximum_round_trip_cost_pct = 8.0
# Liquidity is gated as a share of the pool the order actually routes through,
# with an absolute backstop. An absolute floor alone encodes an account size.
maximum_pool_share_pct = 0.5
minimum_pool_liquidity_usd = 5000.0
maximum_aggregate_open_position_pct = 50.0
